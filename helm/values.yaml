nameOverride: ""
fullnameOverride: ""

namespace: "" # Override the Release namespace if set

commonLabels: {}
  # environment: dev
  # project: tripla

commonAnnotations: {}
  # managed-by: helm

frontend:
  replicas: 1
  image:
    repository: nginx
    tag: stable
  port: 80
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
  
  # Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  # Probes
  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    
  # config:
    # LOG_LEVEL: info
  # secrets:
    # API_KEY: value

backend:
  replicas: 1
  image:
    repository: hashicorp/http-echo
    tag: "1.0.0"
  port: 8080
  service:
    type: ClusterIP
    port: 80
  # config:
    # LOG_LEVEL: info
  # secrets:
    # API_KEY: value

  
  args:
    - "-text=hello"
    - "-listen=:8080"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    averageUtilization: 50
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"

  # Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  # Probes
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10