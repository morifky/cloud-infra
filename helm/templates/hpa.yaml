{{- if .Values.backend.hpa.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tripla-apps.name" . }}-backend-hpa
  namespace: {{ include "tripla-apps.namespace" . }}
  labels:
    {{- include "tripla-apps.labels" . | nindent 4 }}
  annotations:
    {{- include "tripla-apps.annotations" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tripla-apps.name" . }}-backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.averageUtilization }}
{{- end }}